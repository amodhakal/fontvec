[project]
name = "fontvec"
version = "0.1.0"
description = "Turn fonts into vector embeddings"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Amodh Dhakal", email = "amodhakal@gmail.com" }]
dependencies = []

[project.scripts]
fontvec = "fontvec:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
